<style>
:root{--primary:#007bff;--primary-hover:#0056b3;--success:#28a745;--bg-glass:rgba(255,255,255,.85);--border-glass:rgba(255,255,255,.3)}
*{box-sizing:border-box}

.badge.premium{background:linear-gradient(45deg,#ffc107,#ff9800);color:#333}
.nav-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:20px;background:rgba(0,0,0,.04);padding:6px;border-radius:10px;flex-wrap:wrap}
.tab-btn{background:none;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:#555;transition:.2s;white-space:nowrap}
.tab-btn.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.drop-zone{border:2px dashed var(--primary);padding:45px 20px;border-radius:12px;background:rgba(240,248,255,.4);cursor:pointer;transition:.3s;margin-top:10px}
.drop-zone:hover,.drop-zone.over{background:rgba(225,240,255,.7);transform:scale(1.01)}
.dynamic-options{display:none;margin-top:15px;padding:15px;background:rgba(255,255,255,.5);border-radius:8px;border:1px solid rgba(0,0,0,.05);text-align:left;gap:12px}
.dynamic-options.on{display:grid}
.input-group{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#333}
.input-group input,.input-group select{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:inherit}
.hint{font-size:12px;color:#666;min-height:1.2em}
.ad-placeholder{background:rgba(0,0,0,.03);padding:12px;margin:15px 0;border-radius:8px;font-size:12px;color:#666}
.btn-main{background:var(--primary);color:#fff;border:none;padding:14px;width:100%;font-size:16px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:15px;transition:.2s;box-shadow:0 4px 12px rgba(0,123,255,.15)}
.btn-main:hover{background:var(--primary-hover)}.btn-main:disabled{opacity:.55;cursor:not-allowed}
.privacy-seal{font-size:12px;color:var(--success);margin-top:15px;font-weight:500}
#file-status{margin-top:15px;font-size:13px;font-weight:bold;color:#333;min-height:1.3em}
#progress{display:none;height:8px;margin-top:10px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
#progress.on{display:block}#bar{height:100%;width:0;background:linear-gradient(90deg,#007bff,#6aa8ff);transition:width .3s}
#file-list{display:none;margin-top:12px;text-align:left}#file-list.on{display:block}
.fl-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:#666;margin:0 4px 8px;flex-wrap:wrap}
.fl-note{font-size:12px;color:#b4691f;margin:0 4px 8px}
.fl-row{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 10px;margin-bottom:6px;border-radius:8px;font-size:13px;border:1px solid rgba(0,0,0,.06)}
.fl-i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--primary);flex:none}
.fl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl-s{color:#777;font-size:12px;flex:none}
.fl-row button{border:0;background:#eef1f6;width:28px;height:28px;border-radius:6px;cursor:pointer;flex:none}
.fl-row button:hover{background:#dbe6fb}.fl-row button:disabled{opacity:.35;cursor:default}

.res button{background:var(--primary);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal.on{display:flex}

.btn-pay{background:var(--success)}.btn-watch{background:#ff9800}.btn-watch:disabled{opacity:.7;cursor:wait}
.close-btn{margin-top:15px;background:#eee;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}

</div>

      <div style="font-weight:bold;color:#333" id="price-text"></div>
      <button class="btn-pay" id="pay-btn" data-i18n="btn_pay"></button>
    </div>
    <div style="font-size:12px;color:#777" data-i18n="or_text"></div>
    <button class="btn-watch" id="watch-ad-btn"></button>
    <button class="close-btn" id="close-modal-btn" data-i18n="btn_close"></button>
  </div>
</div>

      mode_single: 'Combine selected pages into one PDF', mode_each: 'One PDF per range', mode_all: 'Every page as its own PDF',

      modal_title: '💎 Unlock Premium Features', modal_desc: 'File over 15 MB, more than 3 files, or a Pro-only tool.',

  try { const sv = localStorage.getItem(CFG.LANG_KEY); S.lang = sv === 'en' || sv === 'th' ? sv : ((navigator.language || '').toLowerCase().indexOf('th') === 0 ? 'th' : 'en'); } catch (e) {}
  const t = (k, a) => { let s = translations[S.lang][k] || k; (a || []).forEach((v, i) => { s = s.replace('{' + i + '}', v); }); return s; };

    document.documentElement.lang = S.lang;

    $('freeze-msg').textContent = t(S.tamper ? 'tamper_warn' : 'dev_warn'); $('freeze').classList.toggle('on', frozen());
    if (!adTimer) $('watch-ad-btn').textContent = t('btn_watch'); else $('watch-ad-btn').textContent = t('ad_countdown', [S.adLeft]);
    document.querySelectorAll('.res button.dl').forEach((b) => { b.textContent = t('download'); });
    if (S.tool === 'split' && S.pageCount) $('split-hint').textContent = t('page_info', [S.pageCount, CFG.MAX_PAGES]);

  /* ---------- Signed premium token (HMAC-SHA256) ---------- */
  const enc = new TextEncoder();
  const hmac = async (msg) => {
    const k = await crypto.subtle.importKey('raw', enc.encode(CFG.SECRET + '|' + location.hostname), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);

  async function verifyToken() {
    let raw = null; try { raw = localStorage.getItem(CFG.KEY); } catch (e) {}
    let ok = false;
    if (raw && window.crypto && crypto.subtle) {
      const p = raw.split('.');
      try { if (p.length === 2 && safeEq(await hmac(p[0]), p[1])) { const d = JSON.parse(atob(p[0])); ok = d.t === 'pro' && typeof d.e === 'number' && d.e > Date.now(); } } catch (e) {}
      if (!ok) wipeToken();
    }
    if (ok !== S.pro) { S.pro = ok; applyLang(); }
  }
  async function grantPro(days, email) {
    const payload = btoa(JSON.stringify({ t: 'pro', e: Date.now() + days * 864e5, m: String(email).slice(0, 80) }));
    try { localStorage.setItem(CFG.KEY, payload + '.' + await hmac(payload)); } catch (e) {}
    await verifyToken();
  }
  window.addEventListener('storage', verifyToken);
  setInterval(verifyToken, 3000);

  /* ---------- Anti-tamper: freeze (never wipes a customer's token, never reloads) ---------- */
  setInterval(() => {
    const big = window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 200;
    const t0 = performance.now(); (function () { debugger; })();
    const now = big || performance.now() - t0 > 100;
    if (now !== S.devOpen) { S.devOpen = now; applyLang(); }
  }, 1500);
  new MutationObserver((list) => list.forEach((m) => m.addedNodes.forEach((n) => {
    if (!n.tagName || !/^(SCRIPT|IFRAME|OBJECT|EMBED)$/.test(n.tagName)) return;
    const src = n.src || '';
    if (!src || !CFG.ALLOWED.some((a) => src.indexOf(a) === 0)) { S.tamper = true; S.pro = false; wipeToken(); n.remove(); applyLang(); }
  }))).observe(document.documentElement, { childList: true, subtree: true });

  /* ---------- Geo pricing ---------- */
  async function geo() {
    let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    S.country = tz === 'Asia/Bangkok' ? 'TH' : 'XX'; applyLang();
    try {
      const c = new AbortController(), to = setTimeout(() => c.abort(), 4000);
      const d = await (await fetch('https://ipapi.co/json/', { cache: 'no-store', signal: c.signal })).json(); clearTimeout(to);
      if (d && (d.country_code || d.country)) S.country = String(d.country_code || d.country).toUpperCase();
    } catch (e) {}
    applyLang();
  }

  /* ---------- Progress + results + downloads ---------- */
  function setProgress(p) { const v = Math.max(0, Math.min(1, p)); $('progress').classList.add('on'); $('bar').style.width = (v * 100) + '%'; $('progress').setAttribute('aria-valuenow', Math.round(v * 100)); }
  function hideProgress() { $('progress').classList.remove('on'); $('bar').style.width = '0%'; }
  function triggerBlobDownload(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);   // delayed: immediate revoke can cancel large downloads
  }
  function addResult(name, blob, extra) {
    const d = document.createElement('div'); d.className = 'res';
    const s = document.createElement('span'); s.textContent = name + ' (' + fmt(blob.size) + ')' + (extra || '');
    const b = document.createElement('button'); b.className = 'dl'; b.textContent = t('download');
    b.addEventListener('click', () => triggerBlobDownload(blob, name));
    d.append(s, b); $('results').appendChild(d);
  }

  /* ---------- Engines ---------- */
  let workerReady = false;
  async function engines() {
    if (!window.PDFLib || !window.pdfjsLib) throw new Error(t('lib_fail'));
    if (!workerReady) {
      const js = await (await fetch(CFG.WORKER)).text();
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([js], { type: 'text/javascript' })); workerReady = true;
    }
  }
  const needLib = () => { if (!window.PDFLib) throw new Error(t('lib_fail')); };
  const toBlob = (c, q) => new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  async function loadPdfJs(f) { await engines(); return pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; }
  async function renderPage(doc, n, scale) {
    const page = await doc.getPage(n), vp = page.getViewport({ scale }), base = page.getViewport({ scale: 1 });
    const c = document.createElement('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: x, viewport: vp }).promise; page.cleanup();
    return { c, w: base.width, h: base.height };
  }

  async function imgToPdf() {
    needLib(); const pdf = await PDFLib.PDFDocument.create();
    for (let i = 0; i < S.files.length; i++) {
      const f = S.files[i]; setStatus('step', [i + 1, S.files.length]); setProgress(i / S.files.length);
      const buf = await f.arrayBuffer(), im = f.type === 'image/png' ? await pdf.embedPng(buf) : await pdf.embedJpg(buf);
      pdf.addPage([im.width, im.height]).drawImage(im, { x: 0, y: 0, width: im.width, height: im.height });
    }
    const blob = new Blob([await pdf.save()], { type: 'application/pdf' });
    addResult('EasyConvert_Images.pdf', blob); triggerBlobDownload(blob, 'EasyConvert_Images.pdf');
  }
  async function pdfToImg() {
    const f = S.files[0], doc = await loadPdfJs(f), total = Math.min(doc.numPages, CFG.MAX_PAGES);
    for (let n = 1; n <= total; n++) {
      setStatus('step', [n, total]); setProgress((n - 1) / total);
      const r = await renderPage(doc, n, 2), b = await toBlob(r.c, 0.92); r.c.width = r.c.height = 0;
      addResult('EasyConvert_' + baseName(f.name) + '_Page_' + n + '.jpg', b);
    }
    doc.destroy();
  }
  async function mergePdf() {
    needLib(); if (S.files.length < 2) throw new Error(t('need_two'));
    const out = await PDFLib.PDFDocument.create();
    for (let i = 0; i < S.files.length; i++) {
      const f = S.files[i]; setStatus('step', [i + 1, S.files.length]); setProgress(i / S.files.length);
      let src; try { src = await PDFLib.PDFDocument.load(await f.arrayBuffer()); } catch (e) { throw new Error(t('open_fail', [f.name])); }
      (await out.copyPages(src, src.getPageIndices())).forEach((p) => out.addPage(p));
    }
    const blob = new Blob([await out.save()], { type: 'application/pdf' });
    addResult('EasyConvert_Merged.pdf', blob, t('pages_n', [out.getPageCount()])); triggerBlobDownload(blob, 'EasyConvert_Merged.pdf');
  }
  function parseRanges(str, max) {
    const parts = String(str).split(/[,\s]+/).filter(Boolean);
    if (!parts.length) throw new Error(t('range_empty'));
    return parts.map((p) => {
      const m = p.match(/^(\d+)(?:-(\d+))?$/); if (!m) throw new Error(t('range_bad', [p]));
      let a = +m[1], b = m[2] ? +m[2] : a;
      if (a < 1 || b < 1 || a > max || b > max) throw new Error(t('range_out', [p, max]));
      if (a > b) { const x = a; a = b; b = x; }
      const idx = []; for (let i = a; i <= b; i++) idx.push(i - 1);
      return { label: a === b ? String(a) : a + '-' + b, idx };
    });
  }
  async function loadPageCount() {
    const f = S.files[0]; S.pageCount = 0; $('split-hint').textContent = t('reading');
    try {
      needLib(); const d = await PDFLib.PDFDocument.load(await f.arrayBuffer());
      if (S.files[0] !== f) return; S.pageCount = d.getPageCount(); $('split-hint').textContent = t('page_info', [S.pageCount, CFG.MAX_PAGES]);
    } catch (e) { if (S.files[0] !== f) return; S.files = []; $('split-hint').textContent = '❌ ' + t('open_fail', [f.name]); setStatus('no_file'); }
  }
  async function splitPdf() {
    needLib(); if (!S.pageCount) throw new Error(t('page_wait'));
    const f = S.files[0], mode = $('split-mode').value, base = baseName(f.name);
    const groups = mode === 'all' ? Array.from({ length: Math.min(S.pageCount, CFG.MAX_PAGES) }, (_, i) => ({ label: String(i + 1), idx: [i] })) : parseRanges($('page-range').value, S.pageCount);
    const src = await PDFLib.PDFDocument.load(await f.arrayBuffer());
    if (mode === 'single') {
      const out = await PDFLib.PDFDocument.create(), idx = [].concat(...groups.map((g) => g.idx));
      (await out.copyPages(src, idx)).forEach((p) => out.addPage(p));
      const blob = new Blob([await out.save()], { type: 'application/pdf' }), name = 'EasyConvert_Split_' + base + '.pdf';
      addResult(name, blob, t('pages_n', [idx.length])); triggerBlobDownload(blob, name); return;
    }
    const files = [];
    for (let i = 0; i < groups.length; i++) {
      setStatus('step', [i + 1, groups.length]); setProgress(i / groups.length);
      const out = await PDFLib.PDFDocument.create(); (await out.copyPages(src, groups[i].idx)).forEach((p) => out.addPage(p));
      const blob = new Blob([await out.save()], { type: 'application/pdf' }), name = 'EasyConvert_Split_' + base + '_p' + groups[i].label + '.pdf';
      files.push({ name, blob }); addResult(name, blob, t('pages_n', [groups[i].idx.length]));
    }
    if (files.length > 1) {
      const all = document.createElement('button'); all.className = 'btn-main'; all.style.marginTop = '0'; all.textContent = t('download_all', [files.length]);
      all.addEventListener('click', () => files.forEach((o, i) => setTimeout(() => triggerBlobDownload(o.blob, o.name), i * 400)));
      $('results').insertBefore(all, $('results').firstChild);
    }
  }
  async function compressPdf() {
    needLib(); const f = S.files[0], doc = await loadPdfJs(f), total = Math.min(doc.numPages, CFG.MAX_PAGES), pdf = await PDFLib.PDFDocument.create();
    for (let n = 1; n <= total; n++) {
      setStatus('step', [n, total]); setProgress((n - 1) / total);
      const r = await renderPage(doc, n, 1.5), buf = await (await toBlob(r.c, CFG.JPEG_Q)).arrayBuffer(); r.c.width = r.c.height = 0;
      const im = await pdf.embedJpg(buf); pdf.addPage([r.w, r.h]).drawImage(im, { x: 0, y: 0, width: r.w, height: r.h });
    }
    doc.destroy();
    const blob = new Blob([await pdf.save()], { type: 'application/pdf' });
    if (blob.size >= f.size) { setStatus('small'); return 'small'; }
    addResult('Compressed_' + f.name, blob, t('saved', [Math.round((1 - blob.size / f.size) * 100)]));
  }

  /* ---------- Gate + run (executeFileProcessing) ---------- */
  function needsGate() {
    if (S.pro || S.adCredit >= 1) return false;
    const big = S.files.some((f) => f.size > CFG.AD_LIMIT);
    if (S.tool === 'merge') return S.files.length > 3 || big;
    if (S.tool === 'img2pdf' || S.tool === 'split') return big;
    return true;                                    // pdf2img, compress: Pro or ad
  }
  async function executeFileProcessing() {
    if (!S.files.length) return setStatus('pick_first');
    if (S.busy || frozen()) return;
    if (needsGate()) return openGateModal();
    if (!S.pro && S.adCredit > 0) S.adCredit--;     // one ad = one use
    S.busy = true; $('process-btn').disabled = true; $('results').textContent = ''; setStatus('processing'); setProgress(0.03);
    try {
      const r = await ({ img2pdf: imgToPdf, pdf2img: pdfToImg, merge: mergePdf, split: splitPdf, compress: compressPdf }[S.tool])();
      setProgress(1); if (r !== 'small') setStatus('done');
    } catch (e) { setStatus('error', [e && e.message ? e.message : t('generic_err')]); }
    finally { S.busy = false; $('process-btn').disabled = false; setTimeout(hideProgress, 900); }
  }

  /* ---------- Modal, rewarded ad, payment ---------- */
  let adTimer = null;
  function openGateModal() { if (!frozen()) $('gate-modal').classList.add('on'); }
  function closeGateModal() { clearInterval(adTimer); adTimer = null; $('watch-ad-btn').disabled = false; $('watch-ad-btn').textContent = t('btn_watch'); $('gate-modal').classList.remove('on'); }
  function startRewardedAd() {
    if (adTimer) return; S.adLeft = CFG.AD_SECONDS; $('watch-ad-btn').disabled = true;
    const tick = () => {
      $('watch-ad-btn').textContent = t('ad_countdown', [S.adLeft]);
      if (S.adLeft-- <= 0) { clearInterval(adTimer); adTimer = null; S.adCredit = 1; closeGateModal(); executeFileProcessing(); }
    };
    tick(); adTimer = setInterval(tick, 1000);
  }
  async function simulatePayment() {
    if (!CFG.DEMO) return setStatus('demo_off');
    const email = prompt(t('prompt_email')); if (!email) return;
    await grantPro(30, email); closeGateModal(); setStatus('pro_on');
  }

  /* ---------- Files, list, tabs ---------- */
  const multiTool = () => S.tool === 'img2pdf' || S.tool === 'merge';
  const keyOf = (f) => f.name + '|' + f.size + '|' + f.lastModified;
  function setFiles(list) {
    if (frozen()) return;
    const isImg = S.tool === 'img2pdf';
    let a = Array.from(list).filter((f) => isImg ? /^image\/(png|jpeg)$/.test(f.type) : (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)));
    if (!a.length) return setStatus('bad_type');
    if (!multiTool()) a = [a[0]];
    if (S.tool === 'merge') { const seen = new Set(S.files.map(keyOf)); a = S.files.concat(a.filter((f) => !seen.has(keyOf(f)))); }
    const total = a.reduce((x, f) => x + f.size, 0);
    if (total > CFG.HARD_LIMIT) return setStatus('too_big');
    S.files = a; $('results').textContent = ''; renderList();
    setStatus('file_ready', [a.length === 1 ? a[0].name : t('files_n', [a.length]), fmt(total)]);
    if (S.tool === 'split') loadPageCount();
  }
  function renderList() {
    const box = $('file-list'); box.textContent = '';
    const show = multiTool() && S.files.length > 0; box.classList.toggle('on', show); if (!show) return;
    const head = document.createElement('div'); head.className = 'fl-head';
    const h1 = document.createElement('span'); h1.textContent = '📚 ' + t('files_n', [S.files.length]) + ' · ' + fmt(S.files.reduce((x, f) => x + f.size, 0));
    const h2 = document.createElement('span'); h2.textContent = S.tool === 'merge' ? t('merge_note') : ''; head.append(h1, h2); box.appendChild(head);
    if (S.tool === 'merge' && !S.pro && S.files.length > 3) { const n = document.createElement('div'); n.className = 'fl-note'; n.textContent = t('limit_note'); box.appendChild(n); }
    S.files.forEach((f, i) => {
      const r = document.createElement('div'); r.className = 'fl-row';
      const ix = document.createElement('span'); ix.className = 'fl-i'; ix.textContent = i + 1;
      const nm = document.createElement('span'); nm.className = 'fl-n'; nm.textContent = f.name; nm.title = f.name;
      const sz = document.createElement('span'); sz.className = 'fl-s'; sz.textContent = fmt(f.size); r.append(ix, nm, sz);
      [['up', '↑', i === 0], ['down', '↓', i === S.files.length - 1], ['del', '✕', false]].forEach(([act, ch, dis]) => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.act = act; b.dataset.i = i; b.textContent = ch; b.disabled = dis; b.setAttribute('aria-label', act); r.appendChild(b);
      });
      box.appendChild(r);
    });
  }
  $('file-list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b || S.busy || frozen()) return;
    const i = +b.dataset.i, f = S.files;
    if (b.dataset.act === 'del') f.splice(i, 1);
    else if (b.dataset.act === 'up' && i > 0) [f[i - 1], f[i]] = [f[i], f[i - 1]];
    else if (b.dataset.act === 'down' && i < f.length - 1) [f[i + 1], f[i]] = [f[i], f[i + 1]];
    renderList(); f.length ? setStatus('file_ready', [t('files_n', [f.length]), fmt(f.reduce((x, y) => x + y.size, 0))]) : setStatus('no_file');
  });
  function setTool(k) {
    if (frozen() || S.busy) return;
    S.tool = k; S.files = []; S.pageCount = 0; $('results').textContent = ''; hideProgress(); $('split-hint').textContent = '';
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tool === k));
    const i = $('file-input'); i.accept = k === 'img2pdf' ? 'image/png,image/jpeg' : 'application/pdf'; i.multiple = multiTool();
    $('split-options').classList.toggle('on', k === 'split'); renderList(); setStatus('switch_text', [TOOLNAME[k]]);
  }

  /* ---------- Wiring ---------- */
  const drop = $('drop-area'), input = $('file-input');
  drop.addEventListener('click', () => { if (!frozen()) input.click(); });
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  ['dragenter', 'dragover'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => setFiles(e.dataTransfer.files));
  input.addEventListener('change', () => { setFiles(input.files); input.value = ''; });
  document.querySelectorAll('.tab-btn').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $('lang-toggle').addEventListener('change', (e) => { S.lang = e.target.value === 'en' ? 'en' : 'th'; try { localStorage.setItem(CFG.LANG_KEY, S.lang); } catch (x) {} applyLang(); });
  $('user-badge').addEventListener('click', openGateModal);
  $('user-badge').addEventListener('keydown', (e) => { if (e.key === 'Enter') openGateModal(); });
  $('close-modal-btn').addEventListener('click', closeGateModal);
  $('pay-btn').addEventListener('click', simulatePayment);
  $('watch-ad-btn').addEventListener('click', startRewardedAd);
  $('process-btn').addEventListener('click', executeFileProcessing);

  /* ---------- Boot ---------- */
  $('lang-toggle').value = S.lang; setStatus('no_file'); applyLang(); verifyToken(); geo();
})();
</script>
</body>
</html>
